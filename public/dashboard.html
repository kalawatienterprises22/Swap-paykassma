<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SuperPay Admin Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f1f5f9; color: #172033; }
    header { background: #101827; color: white; padding: 18px; display: flex; justify-content: space-between; align-items: center; }
    main { padding: 20px; max-width: 1100px; margin: auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 15px; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px #00000010; }
    .number { font-size: 28px; font-weight: bold; color: #175bd5; }
    button { border: 0; border-radius: 8px; padding: 10px 15px; color: white; background: #dc3545; font-weight: bold; }
    #status { color: #667085; }
  </style>
</head>
<body>
  <header>
    <strong>SuperPay Admin</strong>
    <button id="logout">Logout</button>
  </header>
  <main>
    <h2>Dashboard Overview</h2>
    <p id="welcome">Checking login...</p>
    <p id="status"></p>
    <section class="grid">
      <div class="card"><h3>Total Merchants</h3><div class="number">—</div></div>
      <div class="card"><h3>Transactions</h3><div class="number">—</div></div>
      <div class="card"><h3>Deposits</h3><div class="number">—</div></div>
      <div class="card"><h3>Withdrawals</h3><div class="number">—</div></div>
    </section>
  </main>
  <script>
    const token = sessionStorage.getItem("superpay_token");
    const savedUser = sessionStorage.getItem("superpay_user");
    const welcome = document.getElementById("welcome");
    const status = document.getElementById("status");
    const numbers = document.querySelectorAll(".number");

    document.getElementById("logout").addEventListener("click", () => {
      sessionStorage.removeItem("superpay_token");
      sessionStorage.removeItem("superpay_user");
      window.location.replace("/login.html");
    });

    async function loadDashboard() {
      if (!token || !savedUser) {
        window.location.replace("/login.html");
        return;
      }
      let user;
      try {
        user = JSON.parse(savedUser);
      } catch {
        sessionStorage.removeItem("superpay_token");
        sessionStorage.removeItem("superpay_user");
        window.location.replace("/login.html");
        return;
      }
      if (user.role !== "SUPER_ADMIN") {
        status.textContent = "Admin access required. Please sign in again.";
        return;
      }

      welcome.textContent = "Welcome, " + user.role;
      status.textContent = "Loading dashboard data...";
      try {
        const response = await fetch("/api/dashboard", {
          method: "GET",
          headers: { "Authorization": "Bearer " + token }
        });
        const data = await response.json();
        if (response.status === 401 || response.status === 403) {
          sessionStorage.removeItem("superpay_token");
          sessionStorage.removeItem("superpay_user");
          window.location.replace("/login.html");
          return;
        }
        if (!response.ok || !data.ok) {
          throw new Error(data.message || "Dashboard data unavailable");
        }
        numbers[0].textContent = data.stats.merchants;
        numbers[1].textContent = data.stats.transactions;
        numbers[2].textContent = data.stats.deposits;
        numbers[3].textContent = data.stats.withdrawals;
        status.textContent = "Dashboard data loaded successfully.";
      } catch (error) {
        status.textContent = error.message || "Unable to load dashboard.";
      }
    }
    loadDashboard();
  </script>
</body>
</html>
