<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set Merchant Password - SuperPay</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;font:15px Arial;color:#172033}.wrap{max-width:440px;margin:45px auto;padding:16px}.card{background:#fff;padding:24px;border-radius:14px;box-shadow:0 3px 14px #0001}label{display:block;margin:16px 0;font-weight:bold;font-size:13px}input{display:block;width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:8px;margin-top:7px;font:inherit}button{width:100%;padding:13px;border:0;border-radius:8px;background:#175bd5;color:white;font-weight:bold}#msg{line-height:1.5;color:#475569}</style></head><body><main class="wrap"><section class="card"><h2>Create your SuperPay password</h2><p>This secure one-time link expires after 24 hours.</p><form id="f"><label>New Password<input id="p" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></label><label>Confirm Password<input id="c" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></label><button id="b">Set Password</button></form><p id="msg" role="status"></p><a href="/login.html">Go to Merchant Login</a></section></main><script>const token=new URLSearchParams(location.search).get("token")||"",f=document.getElementById("f"),msg=document.getElementById("msg"),b=document.getElementById("b");if(!/^[a-f0-9]{64}$/i.test(token)){f.hidden=true;msg.textContent="This setup link is invalid."}f.onsubmit=async e=>{e.preventDefault();const p=document.getElementById("p").value,c=document.getElementById("c").value;if(p.length<12||p.length>72){msg.textContent="Password must be 12-72 characters.";return}if(p!==c){msg.textContent="Passwords do not match.";return}b.disabled=true;msg.textContent="Saving password...";try{const r=await fetch("/api/admin/merchants",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"set_merchant_password",token,password:p})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||"Could not set password");f.hidden=true;msg.textContent=d.message}catch(err){msg.textContent=err.message}finally{b.disabled=false}};</script></body></html>
