<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a2e">
  <title>Paykassma | Secure Login</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;font-family:Inter,Arial,sans-serif;color:#eaf0fb;background:radial-gradient(circle at 15% 10%,#244b83 0,transparent 34%),linear-gradient(135deg,#0b1425,#14243d 58%,#0c1729)}
    .shell{width:100%;max-width:440px}
    .brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px;font-size:25px;font-weight:800;letter-spacing:-.7px}
    .brand-mark{display:grid;place-items:center;width:39px;height:39px;border-radius:12px;background:linear-gradient(135deg,#63a3ff,#2864d8);box-shadow:0 8px 24px #2769d955;color:#fff;font-size:20px}
    .brand span:last-child{color:#fff}.brand em{font-style:normal;color:#76aaff}
    .card{padding:32px;background:#fff;color:#17243a;border:1px solid #e8edf5;border-radius:20px;box-shadow:0 24px 70px #03091470}
    .eyebrow{margin:0 0 8px;color:#3478df;text-transform:uppercase;font-size:10px;font-weight:800;letter-spacing:1.5px}
    h1{margin:0;font-size:25px;letter-spacing:-.6px;color:#17243a}
    .intro{margin:9px 0 24px;color:#748198;font-size:13px;line-height:1.6}
    label{display:block;margin:15px 0 7px;color:#42516a;font-size:12px;font-weight:700}
    input{width:100%;padding:14px 14px;border:1px solid #dce3ee;border-radius:10px;background:#fbfcfe;color:#17243a;font-size:15px;outline:none;transition:border .15s,box-shadow .15s}
    input:focus{border-color:#4385e8;box-shadow:0 0 0 3px #4385e81c}
    button{width:100%;margin-top:21px;padding:14px;border:0;border-radius:10px;background:linear-gradient(100deg,#2869d7,#4388ed);color:#fff;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px #2869d733}
    button:hover{filter:brightness(1.04)}button:disabled{opacity:.65;cursor:wait}
    .admin-access{display:flex;align-items:center;gap:13px;margin-top:17px;padding:14px;border:1px solid #e2eaf5;border-radius:12px;background:#f7faff;text-decoration:none;color:#20324e;transition:border .15s,transform .15s,background .15s}
    .admin-access:hover{border-color:#a8c7f3;background:#f0f6ff;transform:translateY(-1px)}
    .admin-icon{display:grid;place-items:center;flex:0 0 39px;height:39px;border-radius:11px;background:#e6efff;color:#2869d7;font-size:18px}
    .admin-copy{flex:1;min-width:0}.admin-title{display:block;font-size:13px;font-weight:800}.admin-desc{display:block;margin-top:4px;color:#7a879b;font-size:11px}
    .admin-arrow{font-size:19px;color:#3478df}
    .secure-note{display:flex;justify-content:center;gap:7px;align-items:center;margin:20px 0 0;color:#8995a8;font-size:11px}
    #message{margin:14px 0 0;color:#53627a;font-size:12px;line-height:1.5;overflow-wrap:anywhere}
    #setupSection{margin-top:20px;padding-top:18px;border-top:1px solid #edf0f5}
    #setupSection h2{font-size:17px;margin:0 0 6px}#setupSection p{font-size:12px;color:#748198;line-height:1.5}
    [hidden]{display:none!important}
    @media(max-width:480px){body{padding:16px}.card{padding:25px 21px}.brand{margin-bottom:17px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><span class="brand-mark">P</span><span>Pay<em>kassma</em></span></div>
    <section class="card">
      <p class="eyebrow">Merchant portal</p>
      <h1>Welcome back</h1>
      <p class="intro" id="introText">Sign in to securely access your Paykassma merchant account.</p>

      <form id="loginForm">
        <label for="userId">Merchant ID / User ID</label>
        <input id="userId" type="text" placeholder="Enter your User ID" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
        <button id="loginButton" type="submit">Sign in securely</button>
      </form>

      <a class="admin-access" href="/admin-login.html" id="adminAccess">
        <span class="admin-icon">♙</span>
        <span class="admin-copy"><span class="admin-title">Administrator access</span><span class="admin-desc">Sign in to the Admin workspace</span></span>
        <span class="admin-arrow">→</span>
      </a>

      <section id="setupSection" hidden>
        <h2>Create your Paykassma password</h2>
        <p>This secure one-time setup link expires after 24 hours.</p>
        <form id="setupForm">
          <label for="newPassword">New password</label>
          <input id="newPassword" type="password" minlength="12" maxlength="72" placeholder="12–72 characters" autocomplete="new-password" required>
          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" type="password" minlength="12" maxlength="72" placeholder="Re-enter new password" autocomplete="new-password" required>
          <button id="setupButton" type="submit">Create password</button>
        </form>
      </section>
      <p id="message" role="status" aria-live="polite"></p>
      <div class="secure-note"><span>◆</span> Secure, role-based access</div>
    </section>
  </main>

  <script>
    const setupToken = new URLSearchParams(location.search).get("setup_token") || "";
    const setupSection = document.getElementById("setupSection");
    const setupForm = document.getElementById("setupForm");
    if (setupToken) {
      document.getElementById("introText").hidden = true;
      document.getElementById("adminAccess").hidden = true;
      document.getElementById("loginForm").hidden = true;
      document.querySelector(".eyebrow").textContent = "Account security";
      document.querySelector("h1").textContent = "Set up your password";
      setupSection.hidden = false;
      if (!/^[a-f0-9]{64}$/i.test(setupToken)) {
        setupForm.hidden = true;
        document.getElementById("message").textContent = "This password setup link is invalid.";
      }
    }
    setupForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("newPassword").value;
      const confirm = document.getElementById("confirmPassword").value;
      const msg = document.getElementById("message");
      const btn = document.getElementById("setupButton");
      if (password.length < 12 || password.length > 72) { msg.textContent = "Password must be 12–72 characters."; return; }
      if (password !== confirm) { msg.textContent = "Passwords do not match."; return; }
      btn.disabled = true; msg.textContent = "Creating password...";
      try {
        const response = await fetch("/api/admin/merchants", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "set_merchant_password", token: setupToken, password })
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.message || "Could not create password");
        setupForm.hidden = true;
        msg.textContent = data.message || "Password created successfully. You can now log in.";
      } catch (error) {
        msg.textContent = error.message;
      } finally { btn.disabled = false; }
    });

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = "Please wait...";
      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            login_type: "standard",
            user_id: document.getElementById("userId").value.trim(),
            password: document.getElementById("password").value
          })
        });
        const data = await response.json();
        if (!response.ok || !data.ok) {
          message.textContent = data.message || "Login failed";
          return;
        }
        sessionStorage.setItem("superpay_token", data.token);
        sessionStorage.setItem("superpay_user", JSON.stringify(data.user));
        message.textContent = "Login successful!";
        if (data.user.role === "MERCHANT") {
          window.location.replace("/merchant-dashboard.html");
        } else if (data.user.role === "ADMIN") {
          window.location.replace("/admin-dashboard.html");
        } else {
          sessionStorage.removeItem("superpay_token");
          sessionStorage.removeItem("superpay_user");
          message.textContent = "This account cannot use the Merchant / Admin login.";
        }
        form.reset();
      } catch {
        message.textContent = "Connection error. Please try again.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
