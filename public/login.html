<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paykassma Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #101827;
    }
    .card {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      background: white;
      border-radius: 16px;
    }
    h1 { color: #175bd5; }
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #ccc; }
    button {
      border: 0;
      color: white;
      background: #175bd5;
      font-weight: bold;
    }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Paykassma</h1>
    <p>Merchant / Common Login</p>
    <p><a href="/admin-login.html">Admin Login → Open Admin Panel</a></p>

    <form id="loginForm">
      <input id="userId" type="text"
        placeholder="User ID" autocomplete="username" required>

      <input id="password" type="password"
        placeholder="Password" autocomplete="current-password" required>

      <button id="loginButton" type="submit">Login</button>
    </form>

    <section id="setupSection" hidden>
      <h2>Create your Paykassma password</h2>
      <p>This secure one-time link expires after 24 hours.</p>
      <form id="setupForm">
        <input id="newPassword" type="password" minlength="12" maxlength="72" placeholder="New Password (12-72 characters)" autocomplete="new-password" required>
        <input id="confirmPassword" type="password" minlength="12" maxlength="72" placeholder="Confirm Password" autocomplete="new-password" required>
        <button id="setupButton" type="submit">Create Password</button>
      </form>
    </section>
    <p id="message" role="status"></p>
  </main>

  <script>
    const setupToken = new URLSearchParams(location.search).get("setup_token") || "";
    const setupSection = document.getElementById("setupSection");
    const setupForm = document.getElementById("setupForm");
    if (setupToken) {
      document.querySelector("main.card > p").hidden = true;
      document.querySelector("main.card > p a")?.parentElement?.setAttribute("hidden", "");
      document.getElementById("loginForm").hidden = true;
      setupSection.hidden = false;
      if (!/^[a-f0-9]{64}$/i.test(setupToken)) {
        setupForm.hidden = true;
        document.getElementById("message").textContent = "This password setup link is invalid.";
      }
    }
    setupForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("newPassword").value;
      const confirm = document.getElementById("confirmPassword").value;
      const msg = document.getElementById("message");
      const btn = document.getElementById("setupButton");
      if (password.length < 12 || password.length > 72) { msg.textContent = "Password must be 12-72 characters."; return; }
      if (password !== confirm) { msg.textContent = "Passwords do not match."; return; }
      btn.disabled = true; msg.textContent = "Creating password...";
      try {
        const response = await fetch("/api/admin/merchants", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "set_merchant_password", token: setupToken, password })
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.message || "Could not create password");
        setupForm.hidden = true;
        msg.textContent = data.message || "Password created successfully. You can now log in.";
      } catch (error) {
        msg.textContent = error.message;
      } finally { btn.disabled = false; }
    });

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = "Please wait...";

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            login_type: "standard",
            user_id: document.getElementById("userId").value.trim(),
            password: document.getElementById("password").value
          })
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          message.textContent = data.message || "Login failed";
          return;
        }

        sessionStorage.setItem("superpay_token", data.token);
        sessionStorage.setItem("superpay_user", JSON.stringify(data.user));

        message.textContent = "Login successful!";

if (data.user.role === "MERCHANT") {
          window.location.replace("/merchant-dashboard.html");
        } else if (data.user.role === "ADMIN") {
          window.location.replace("/admin-dashboard.html");
        } else {
          sessionStorage.removeItem("superpay_token");
          sessionStorage.removeItem("superpay_user");
          message.textContent = "This account cannot use the Merchant / Admin login.";
        }
        form.reset();

      } catch {
        message.textContent = "Connection error. Please try again.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
