<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ParixBet Admin Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,#101a32,#1d3765);font-family:Arial,sans-serif;color:#17243b}
.panel{width:100%;max-width:410px;background:#fff;border-radius:18px;padding:28px;box-shadow:0 20px 60px #0004}.brand{font-size:28px;font-weight:800;color:#17376b}.brand span{color:#2876e8}.sub{color:#718096;font-size:13px;line-height:1.6;margin:8px 0 24px}label{display:block;font-size:12px;font-weight:700;margin:15px 0 7px}input{width:100%;padding:13px;border:1px solid #dce3ed;border-radius:9px;font-size:15px}button{width:100%;border:0;border-radius:9px;padding:14px;background:#286bd6;color:white;font-weight:700;font-size:15px;margin-top:20px}button:disabled{opacity:.6}#msg{font-size:12px;line-height:1.5;color:#bd3434;margin-top:14px;min-height:18px}.foot{font-size:11px;color:#8490a3;margin-top:20px;text-align:center}
</style></head><body><main class="panel"><div class="brand">Parix<span>Bet</span></div><div class="sub">Gaming Admin Login<br>यह Paykassma से अलग और स्वतंत्र लॉगिन है।</div>
<form id="login"><label>Admin Username</label><input name="user_id" autocomplete="username" required><label>Password</label><input name="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">Login to ParixBet</button><div id="msg" role="alert"></div></form>
<div class="foot">ParixBet Entertainment Platform · Admin Access</div></main>
<script>
const sessionNotice=sessionStorage.getItem("parixbet_admin_notice");if(sessionNotice){document.getElementById("msg").textContent=sessionNotice;sessionStorage.removeItem("parixbet_admin_notice");}
document.getElementById("login").addEventListener("submit",async e=>{e.preventDefault();const f=e.currentTarget,b=document.getElementById("submit"),m=document.getElementById("msg");b.disabled=true;m.textContent="लॉगिन जांच रहे हैं…";try{const body=Object.fromEntries(new FormData(f));const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...body,login_type:"gaming_admin"})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message||"Login failed");sessionStorage.setItem("parixbet_admin_token",d.token);sessionStorage.setItem("parixbet_admin_user",JSON.stringify(d.user));location.replace("/parixbet-admin-dashboard.html")}catch(err){m.textContent=err.message}finally{b.disabled=false}});
</script></body></html>
