<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a2e">
<title>Paykassma | Admin Access</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;display:grid;place-items:center;font-family:Inter,Arial,sans-serif;color:#eaf0fb;background:radial-gradient(circle at 15% 10%,#244b83 0,transparent 34%),linear-gradient(135deg,#0b1425,#14243d 58%,#0c1729)}
.shell{width:100%;max-width:440px}.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px;font-size:25px;font-weight:800;letter-spacing:-.7px}.mark{display:grid;place-items:center;width:39px;height:39px;border-radius:12px;background:linear-gradient(135deg,#63a3ff,#2864d8);box-shadow:0 8px 24px #2769d955;color:#fff}
.brand em{font-style:normal;color:#76aaff}.card{padding:32px;background:#fff;color:#17243a;border:1px solid #e8edf5;border-radius:20px;box-shadow:0 24px 70px #03091470}
.eyebrow{margin:0 0 8px;color:#3478df;text-transform:uppercase;font-size:10px;font-weight:800;letter-spacing:1.5px}h1{margin:0;font-size:25px;letter-spacing:-.6px}
.intro{margin:9px 0 24px;color:#748198;font-size:13px;line-height:1.6}label{display:block;margin:15px 0 7px;color:#42516a;font-size:12px;font-weight:700}
input{width:100%;padding:14px;border:1px solid #dce3ee;border-radius:10px;background:#fbfcfe;color:#17243a;font-size:15px;outline:none}input:focus{border-color:#4385e8;box-shadow:0 0 0 3px #4385e81c}
button{width:100%;margin-top:21px;padding:14px;border:0;border-radius:10px;background:linear-gradient(100deg,#2869d7,#4388ed);color:#fff;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px #2869d733}button:disabled{opacity:.65;cursor:wait}
.access{display:flex;align-items:center;gap:13px;margin-top:17px;padding:14px;border:1px solid #e2eaf5;border-radius:12px;background:#f7faff;text-decoration:none;color:#20324e;transition:.15s}.access:hover{border-color:#a8c7f3;background:#f0f6ff;transform:translateY(-1px)}
.access-icon{display:grid;place-items:center;flex:0 0 39px;height:39px;border-radius:11px;background:#e6efff;color:#2869d7;font-size:18px}.copy{flex:1;min-width:0}.title{display:block;font-size:13px;font-weight:800}.desc{display:block;margin-top:4px;color:#7a879b;font-size:11px}.arrow{font-size:19px;color:#3478df}
.note{display:flex;justify-content:center;gap:7px;align-items:center;margin:20px 0 0;color:#8995a8;font-size:11px}#message{margin:14px 0 0;color:#53627a;font-size:12px;line-height:1.5;overflow-wrap:anywhere;min-height:18px}[hidden]{display:none!important}
@media(max-width:480px){body{padding:16px}.card{padding:25px 21px}.brand{margin-bottom:17px}}
</style></head>
<body><main class="shell">
<div class="brand"><span class="mark">P</span><span>Pay<em>kassma</em></span></div>
<section class="card">
<p class="eyebrow">Administrator workspace</p><h1>Admin sign in</h1>
<p class="intro">Authorized administrators can securely access merchant operations and review tools.</p>
<form id="form">
<label for="user">Admin User ID</label><input id="user" type="text" autocomplete="username" placeholder="Enter your Admin User ID" required>
<label for="pass">Password</label><input id="pass" type="password" autocomplete="current-password" placeholder="Enter your password" required>
<button id="submit" type="submit">Sign in to Admin</button>
</form>
<p id="message" role="status" aria-live="polite"></p>
<a class="access" href="/login.html"><span class="access-icon">▣</span><span class="copy"><span class="title">Merchant / Common Login</span><span class="desc">Go to the merchant sign-in page</span></span><span class="arrow">→</span></a>
<div class="note">◆ Secure, role-based administrator access</div>
</section></main>
<script>
const form=document.getElementById("form"),msg=document.getElementById("message"),btn=document.getElementById("submit");
form.addEventListener("submit",async e=>{
 e.preventDefault();btn.disabled=true;msg.textContent="Verifying your Admin account…";
 try{
  const response=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({login_type:"standard",user_id:document.getElementById("user").value.trim(),password:document.getElementById("pass").value})});
  let data;try{data=await response.json()}catch{throw new Error("Server returned an unreadable response. Please try again.")}
  if(!response.ok||!data.ok)throw new Error(data.message||"Login failed. Check your User ID and password.");
  if(data.user?.role!=="ADMIN")throw new Error(data.user?.role==="SUPER_ADMIN"?"Super Admin must use the separate Super Admin login.":"This account is not an Admin account. Use Merchant / Common Login if you are a merchant.");
  sessionStorage.setItem("superpay_token",data.token);sessionStorage.setItem("superpay_user",JSON.stringify(data.user));
  msg.textContent="Login successful. Opening Admin Dashboard…";window.location.replace("/admin-dashboard.html");
 }catch(error){msg.textContent=error.message||"Connection error. Please try again."}
 finally{btn.disabled=false}
});
</script></body></html>
