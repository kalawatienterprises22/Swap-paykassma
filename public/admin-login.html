<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SuperPay · Admin Login</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:#101827;font:15px Arial,sans-serif}.card{width:100%;max-width:420px;background:#fff;padding:26px;border-radius:16px}h1{color:#175bd5;margin:0 0 8px}p{color:#64748b;line-height:1.5}label{display:block;font-size:13px;font-weight:bold;margin-top:15px}input{display:block;width:100%;padding:14px;margin-top:7px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:8px;background:#175bd5;color:#fff;font-size:16px;font-weight:bold}a{color:#175bd5}#message{overflow-wrap:anywhere;min-height:22px}</style></head>
<body><main class="card"><h1>SuperPay Admin</h1><p>यह Admin Panel का अलग Login है। Merchant account यहाँ login नहीं कर सकता।</p>
<form id="form"><label>Admin User ID<input id="user" autocomplete="username" required></label><label>Password<input id="pass" type="password" autocomplete="current-password" required></label><button id="submit" type="submit">Admin Login</button></form>
<p id="message" role="status"></p><p><a href="/login.html">Merchant / Common Login</a></p>
</main><script>
const form=document.getElementById("form"),msg=document.getElementById("message"),btn=document.getElementById("submit");
form.addEventListener("submit",async e=>{e.preventDefault();btn.disabled=true;msg.textContent="Checking Admin account…";
try{const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({login_type:"standard",user_id:document.getElementById("user").value.trim(),password:document.getElementById("pass").value})});const d=await r.json().catch(()=>({ok:false,message:"Invalid server response"}));
if(!r.ok||!d.ok)throw Error(d.message||"Login failed");if(d.user?.role!=="ADMIN")throw Error("यह Admin account नहीं है। Merchant के लिए Common Login खोलें।");
sessionStorage.setItem("superpay_token",d.token);sessionStorage.setItem("superpay_user",JSON.stringify(d.user));location.replace("/admin-dashboard.html");}
catch(err){msg.textContent=err.message||"Login failed. Please try again.";}finally{btn.disabled=false;}});
</script></body></html>
