<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paykassma · My Settings</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172033;font:15px Arial,sans-serif}header{background:#101827;color:white;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}a{color:#dbeafe}.wrap{max-width:760px;margin:auto;padding:20px}.panel{background:#fff;border-radius:13px;padding:20px;margin:14px 0;box-shadow:0 2px 8px #0000000b}label{display:block;font-weight:bold;font-size:13px;color:#475569;margin:13px 0}input{display:block;width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;margin-top:6px;font-size:15px}button{background:#175bd5;color:#fff;border:0;border-radius:8px;padding:12px 16px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.muted{color:#64748b;font-size:13px;line-height:1.5}#message{min-height:22px}
</style></head><body><header><strong>Paykassma · MY SETTINGS</strong><nav><a href="/admin-dashboard.html">Admin Dashboard</a></nav></header>
<main class="wrap"><h2>My Settings</h2><section class="panel"><h3>Account Details</h3><p class="muted" id="profile">Loading account…</p><p class="muted">यहाँ से आप अपने Admin login का password बदल सकते हैं। नया password 12 से 72 characters का होना चाहिए।</p></section>
<section class="panel"><h3>Change Password</h3><form id="form"><label>Current Password<input id="current" type="password" autocomplete="current-password" required></label><label>New Password<input id="next" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></label><label>Confirm New Password<input id="confirm" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></label><button id="save" type="submit">Update Password</button></form><p id="message" role="status"></p></section></main>
<script>
const token=sessionStorage.getItem("superpay_token");let user=null;const $=id=>document.getElementById(id);
function logout(){sessionStorage.removeItem("superpay_token");sessionStorage.removeItem("superpay_user");location.replace("/login.html")}
async function verifySession(){try{user=JSON.parse(sessionStorage.getItem("superpay_user")||"null");if(!token||user?.role!=="ADMIN")return logout();const r=await fetch("/api/admin/merchants?role=MERCHANT",{headers:{Authorization:"Bearer "+token}});const d=await r.json().catch(()=>({ok:false}));if(!r.ok||!d.ok)return logout();$("profile").textContent=(user.display_name||"Admin")+" · User ID: "+(user.user_id||"—");}catch{logout()}}verifySession();
$("form").onsubmit=async e=>{e.preventDefault();const current_password=$("current").value,new_password=$("next").value;if(new_password!==$("confirm").value){$("message").textContent="New password and confirmation do not match.";return;}const b=$("save");b.disabled=true;$("message").textContent="Updating password…";try{const r=await fetch("/api/admin/merchants",{method:"PATCH",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({action:"change_own_password",current_password,new_password})});const d=await r.json().catch(()=>({ok:false,message:"Invalid server response"}));if(!r.ok||!d.ok)throw Error(d.message||"Password update failed");$("form").reset();$("message").textContent=d.message+" Please use your new password next time you sign in.";}catch(err){$("message").textContent=err.message;}finally{b.disabled=false}};
</script></body></html>
