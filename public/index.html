<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SuperPay Admin Setup</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      padding: 25px 15px;
    }
    .card {
      max-width: 420px;
      margin: 40px auto;
      padding: 24px;
      background: white;
      border-radius: 14px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      border-radius: 7px;
      border: 1px solid #ccc;
    }
    button {
      background: #175bd5;
      color: white;
      border: 0;
      font-weight: bold;
    }
    #result {
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>SuperPay Admin Setup</h2>
    <p>Create your first Super Admin account.</p>

    <form id="setupForm">
      <input value="sanjanaraj576" readonly>

      <input
        type="password"
        id="password"
        placeholder="Create a strong password"
        minlength="12"
        maxlength="64"
        autocomplete="new-password"
        required
      >

      <input
        type="password"
        id="secret"
        placeholder="Bootstrap Secret"
        autocomplete="off"
        required
      >

      <button type="submit" id="submitBtn">
        Create Super Admin
      </button>
    </form>

    <p id="result" role="status"></p>
  </div>

  <script>
    const form = document.getElementById("setupForm");
    const result = document.getElementById("result");
    const button = document.getElementById("submitBtn");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const secret = document.getElementById("secret").value;

      if (password.length < 12 || password.length > 64) {
        result.textContent = "Use a password of 12 to 64 characters.";
        return;
      }

      if (secret.length < 32) {
        result.textContent = "Invalid bootstrap secret.";
        return;
      }

      button.disabled = true;
      result.textContent = "Creating account...";

      try {
        const response = await fetch("/api/create-admin", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-bootstrap-secret": secret
          },
          body: JSON.stringify({ password }),
          credentials: "omit"
        });

        const data = await response.json();

        if (response.ok && data.ok) {
          result.textContent = "Super Admin created successfully!";
          form.reset();
        } else {
          result.textContent = data.message || "Setup failed.";
        }
      } catch (error) {
        result.textContent = "Connection failed. Please try again.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
