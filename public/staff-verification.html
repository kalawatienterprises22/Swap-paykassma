<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SuperPay Staff Verification</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font:14px Arial}header{background:#101827;color:white;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}header a{color:white}main{max-width:1000px;margin:22px auto;padding:0 14px}.card{background:white;border:1px solid #e5eaf1;border-radius:12px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}label{display:block;font-size:12px;color:#475467}input,select{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:7px;margin-top:6px}button{border:0;border-radius:7px;padding:11px 15px;background:#246bdb;color:white;font-weight:bold;cursor:pointer}.secondary{background:#eef3ff;color:#245fc0}.danger{background:#fff0f0;color:#b42318}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:11px;border-bottom:1px solid #e8edf3;font-size:12px}.muted{color:#667085;font-size:12px}#msg{margin-top:12px;color:#067647}</style></head>
<body><header><b>SuperPay · Manager Verification</b><nav><a href="/balances.html">Back to Dashboard</a> &nbsp; <button id="logout" class="danger">Logout</button></nav></header>
<main><h2>Staff / Manager Verification</h2><p class="muted">Manager का Staff User ID verify करें और अलग रिकॉर्ड कॉलम में देखें।</p>
<section class="card"><h3>Verify Manager / Staff</h3><form id="verifyForm"><div class="grid"><label>Staff / Manager User ID<input id="staffUserId" required maxlength="120" placeholder="Enter User ID"></label><label>Belongs To / Manager Name<input id="belongsTo" required maxlength="120" placeholder="Manager / Admin name"></label><label>Verification Status<select id="verifyStatus"><option value="ACTIVE">Verified / Active</option><option value="REVOKED">Not Verified / Revoked</option></select></label></div><p><button type="submit" id="save">Save Verification</button></p></form><div id="msg" role="status"></div></section>
<section class="card"><h3>Verification Records</h3><div class="tablewrap"><table><thead><tr><th>Staff / Manager User ID</th><th>Belongs To</th><th>Verification Status</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="4">Loading...</td></tr></tbody></table></div></section></main>
<script>
const token=sessionStorage.getItem("superpay_token");let user=null;try{user=JSON.parse(sessionStorage.getItem("superpay_user")||"null")}catch{}
const $=id=>document.getElementById(id);function logout(){sessionStorage.removeItem("superpay_token");sessionStorage.removeItem("superpay_user");location.replace(user?.role==="SUPER_ADMIN"?"/super-admin-login.html":"/login.html")}
$("logout").onclick=logout;
if(!token||!user||!["SUPER_ADMIN","ADMIN"].includes(user.role))location.replace("/login.html");
async function api(method="GET",body){const r=await fetch("/api/admin/staff-verify",{method,headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(r.status===401||r.status===403){logout();throw Error(d.error||"Access denied")}if(!r.ok||!d.ok)throw Error(d.error||"Request failed");return d}
async function load(){try{const d=await api();$("rows").innerHTML=(d.verifications||[]).map(v=>'<tr><td>'+esc(v.staff_user_id)+'</td><td>'+esc(v.belongs_to)+'</td><td>'+(v.status==="ACTIVE"?'Verified':'Revoked')+'</td><td><button class="secondary" data-edit="'+esc(v.staff_user_id)+'">Edit</button> <button class="danger" data-revoke="'+esc(v.staff_user_id)+'">Revoke</button></td></tr>').join("")||'<tr><td colspan="4">No manager verification records yet.</td></tr>';document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const v=(d.verifications||[]).find(x=>x.staff_user_id===b.dataset.edit);$("staffUserId").value=v.staff_user_id;$("belongsTo").value=v.belongs_to;$("verifyStatus").value=v.status;window.scrollTo({top:0,behavior:"smooth"})});document.querySelectorAll("[data-revoke]").forEach(b=>b.onclick=async()=>{const v=(d.verifications||[]).find(x=>x.staff_user_id===b.dataset.revoke);try{await api("POST",{staffUserId:v.staff_user_id,belongsTo:v.belongs_to,status:"REVOKED"});$("msg").textContent="Verification revoked.";load()}catch(e){$("msg").textContent=e.message}})}catch(e){$("rows").innerHTML='<tr><td colspan="4">'+esc(e.message)+'</td></tr>'}}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("verifyForm").onsubmit=async e=>{e.preventDefault();$("save").disabled=true;try{await api("POST",{staffUserId:$("staffUserId").value.trim(),belongsTo:$("belongsTo").value.trim(),status:$("verifyStatus").value});$("msg").textContent="Staff / Manager verification saved.";e.target.reset();await load()}catch(err){$("msg").textContent=err.message}finally{$("save").disabled=false}};
load();
</script></body></html>
