<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SuperPay Admin Users</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172033;font:14px Arial,sans-serif}header{background:#101827;color:white;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}header a{color:#dbeafe;margin-right:14px}main{max-width:1000px;margin:auto;padding:18px}.panel{background:white;padding:18px;border-radius:12px;margin:14px 0;box-shadow:0 2px 8px #0000000d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}label{font-weight:bold;color:#475569;font-size:13px}input{display:block;width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;margin-top:6px}button{padding:10px 13px;border:0;border-radius:8px;background:#175bd5;color:white;font-weight:bold;margin:4px;cursor:pointer}.secondary{background:#64748b}.danger{background:#dc3545}.muted{color:#64748b;font-size:12px}#message{min-height:22px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:left;padding:11px;border-bottom:1px solid #e2e8f0}
</style></head><body>
<header><strong>SuperPay · Admin Accounts</strong><nav><a href="/dashboard.html">Super Admin Dashboard</a><button id="logout" class="secondary">Logout</button></nav></header>
<main><h2>Create Admin Login</h2><p class="muted">यहाँ बनाए गए Admin अपने User ID और Password से सामान्य Admin Login पर लॉगिन करेंगे। Super Admin का लॉगिन अलग रहेगा।</p>
<section class="panel"><form id="createForm"><div class="grid">
<label>Admin Name<input name="display_name" required minlength="2" maxlength="80" placeholder="Admin name"></label>
<label>Admin User ID<input name="user_id" required minlength="4" maxlength="32" pattern="[A-Za-z0-9_-]+" placeholder="e.g. admin_01"></label>
<label>Email (optional)<input name="email" type="email" maxlength="254" placeholder="admin@example.com"></label>
<label>Initial Password<input name="password" type="password" required minlength="12" maxlength="72" autocomplete="new-password" placeholder="At least 12 characters"></label>
</div><p><button id="createButton" type="submit">Create Admin Login</button></p></form><p id="message" role="status"></p></section>
<section class="panel"><h3>Admin Accounts</h3><div class="tablewrap"><table><thead><tr><th>Name</th><th>User ID</th><th>Email</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading...</td></tr></tbody></table></div></section>
</main><script>
const token=sessionStorage.getItem("superpay_token");let rows=document.getElementById("rows"),message=document.getElementById("message");
function logout(){sessionStorage.removeItem("superpay_token");sessionStorage.removeItem("superpay_user");location.replace("/super-admin-login.html")}
document.getElementById("logout").onclick=logout;
async function api(method="GET",body){const r=await fetch("/api/admin/merchants?role=ADMIN",{method,headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json().catch(()=>({ok:false,message:"Invalid response"}));if(r.status===401||r.status===403){logout();throw Error(d.message||"Access denied")}if(!r.ok||!d.ok)throw Error(d.message||"Request failed");return d}
function cell(tr,value){const td=document.createElement("td");td.textContent=value||"—";tr.appendChild(td)}
async function load(){try{const d=await api();rows.replaceChildren();(d.accounts||[]).forEach(a=>{const tr=document.createElement("tr");cell(tr,a.display_name);cell(tr,a.user_id);cell(tr,a.email);cell(tr,a.status);const td=document.createElement("td");const toggle=document.createElement("button");toggle.className=a.status==="ACTIVE"?"danger":"secondary";toggle.textContent=a.status==="ACTIVE"?"Suspend":"Activate";toggle.onclick=async()=>{try{await api("PATCH",{id:a.id,role:"ADMIN",status:a.status==="ACTIVE"?"SUSPENDED":"ACTIVE"});await load()}catch(e){message.textContent=e.message}};const reset=document.createElement("button");reset.className="secondary";reset.textContent="Reset Password";reset.onclick=async()=>{const p=prompt("Enter new password (12-72 characters) for "+a.user_id);if(p===null)return;if(p.length<12||p.length>72){message.textContent="Password must be 12-72 characters.";return}try{await api("PATCH",{id:a.id,role:"ADMIN",action:"reset_password",password:p});message.textContent="Password reset for "+a.user_id; }catch(e){message.textContent=e.message}};td.append(toggle,reset);tr.appendChild(td);rows.appendChild(tr)});if(!(d.accounts||[]).length){const tr=document.createElement("tr");cell(tr,"No Admin accounts yet");rows.appendChild(tr)}}catch(e){message.textContent=e.message}}
document.getElementById("createForm").onsubmit=async ev=>{ev.preventDefault();const b=document.getElementById("createButton");b.disabled=true;message.textContent="Creating Admin...";const data=Object.fromEntries(new FormData(ev.currentTarget).entries());data.role="ADMIN";try{const d=await api("POST",data);ev.currentTarget.reset();message.textContent="Admin login created: "+d.merchant.user_id;await load()}catch(e){message.textContent=e.message}finally{b.disabled=false}};
try{const u=JSON.parse(sessionStorage.getItem("superpay_user")||"null");if(!token||u?.role!=="SUPER_ADMIN")logout();else load()}catch{logout()}
</script></body></html>
